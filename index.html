$('#results').textContent=`顯示 ${shown.length} / ${cards.length} 張 · 完成 ${Math.round(owned/cards.length*100)}%`;$('#empty').hidden=!!shown.length;const fragment=document.createDocumentFragment();for(const c of shown){let tile=document.createElement('button');tile.className='tile '+(statusOf(c.id)==='owned'?'owned':statusOf(c.id)==='wish'?'wish':'');let img=document.createElement('img');img.src=c.image;img.loading='lazy';img.className='photo';img.alt=displayName(c);tile.append(img);if(statusOf(c.id)!=='none'){let m=document.createElement('span');m.className='mark '+(statusOf(c.id)==='owned'?'o':'w');m.textContent=statusOf(c.id)==='owned'?'✓':'♡';tile.append(m)}let name=document.createElement('div');name.className='tile-name';name.textContent=displayName(c);tile.append(name);let meta=document.createElement('div');meta.className='tile-meta';meta.textContent=`P${c.page} · ${c.row}-${c.col}`;tile.append(meta);tile.onclick=()=>openCard(c);fragment.append(tile)}$('#grid').replaceChildren(fragment)}
function openCard(c){current=c;$('#detailimg').src=c.image;$('#detailid').textContent=`PAGE ${c.page} · ROW ${c.row} · CARD ${c.col}`;$('#detailtitle').textContent=displayName(c);$('#detailgroup').textContent=c.group;$('#customname').value=state[c.id]?.name||'';$('#notes').value=state[c.id]?.notes||'';paintButtons(statusOf(c.id));$('#overlay').classList.add('show')}
function paintButtons(s){document.querySelectorAll('[data-status]').forEach(b=>{b.className=b.dataset.status===s?(s==='wish'?'wishactive':'active'):''})}
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{if(!current)return;state[current.id]={...state[current.id],status:b.dataset.status};saveState();paintButtons(b.dataset.status);render()});
$('#save').onclick=()=>{if(!current)return;state[current.id]={...state[current.id],name:$('#customname').value.trim(),notes:$('#notes').value.trim()};saveState();$('#overlay').classList.remove('show');render()};$('#close').onclick=()=>{$('#overlay').classList.remove('show')};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').classList.remove('show')});
for(const el of ['search','page','status','sort'])$('#'+el).addEventListener(el==='search'?'input':'change',render);
$('#export').onclick=()=>{const data={app:'yoshi-poca-archive',version:1,exportedAt:new Date().toISOString(),state};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='yoshi-poca-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='yoshi-poca-archive'||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error('無效的備份格式');if(!confirm('匯入會取代目前所有收集紀錄，確定要繼續嗎？'))return;state=d.state;saveState();render();alert('匯入成功！')}catch(err){alert('備份檔案讀取失敗：'+err.message)}finally{e.target.value=''}};
render();
</script></body></html>
